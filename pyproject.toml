[project]
name = "omnicopilot"
version = "0.1.0"
description = "Cooperative Multimodal AI Under Communication Constraints"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
  { name = "OmniCopilot Team" },
]
keywords = [
  "cooperative-perception",
  "multi-agent",
  "world-model",
  "reinforcement-learning",
  "autonomous-driving",
  "v2x",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  # Core
  "numpy>=1.26,<2.0",
  "scipy>=1.12,<2.0",
  "pydantic>=2.6,<3.0",

  # ML / Deep Learning
  "torch>=2.2,<3.0",
  "torchvision>=0.17,<1.0",
  "lightning>=2.2,<3.0",
  "onnx>=1.15,<2.0",
  "onnxruntime>=1.17,<2.0",

  # Reinforcement Learning
  "gymnasium>=0.29,<1.0",

  # Protobuf
  "protobuf>=4.25,<5.0",
  "grpcio>=1.62,<2.0",
  "grpcio-tools>=1.62,<2.0",

  # Configuration
  "hydra-core>=1.3,<2.0",
  "omegaconf>=2.3,<3.0",

  # Experiment Tracking
  "wandb>=0.16,<1.0",

  # Visualization
  "matplotlib>=3.8,<4.0",
  "plotly>=5.19,<6.0",

  # Data
  "pandas>=2.2,<3.0",
  "pyarrow>=15.0,<16.0",
  "open3d>=0.18,<1.0",

  # LLM / RAG
  "openai>=1.12,<2.0",
  "qdrant-client>=1.8,<2.0",
  "sentence-transformers>=2.5,<3.0",
  "langgraph>=0.0.26",

  # Logging
  "structlog>=24.1,<25.0",

  # Utilities
  "rich>=13.7,<14.0",
  "tqdm>=4.66,<5.0",
  "typer>=0.9,<1.0",
]

[project.optional-dependencies]
# Development tools
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=4.1,<5.0",
  "pytest-xdist>=3.5,<4.0",
  "pytest-timeout>=2.2,<3.0",
  "hypothesis>=6.98,<7.0",
  "mypy>=1.8,<2.0",
  "ruff>=0.3,<1.0",
  "pre-commit>=3.6,<4.0",
  "ipython>=8.21,<9.0",
]

# Jupyter notebooks
notebooks = [
  "jupyterlab>=4.1,<5.0",
  "ipywidgets>=8.1,<9.0",
  "nbformat>=5.9,<6.0",
]

# CARLA simulation (optional — heavy dependency)
carla = [
  "carla>=0.9.15",
]

# Demo application
demo = [
  "rerun-sdk>=0.14,<1.0",
  "streamlit>=1.31,<2.0",
  "dash>=2.15,<3.0",
]

# Distributed RL training
distributed = [
  "ray[rllib]>=2.9,<3.0",
]

# Observability
observability = [
  "prometheus-client>=0.20,<1.0",
  "opentelemetry-api>=1.23,<2.0",
  "opentelemetry-sdk>=1.23,<2.0",
  "opentelemetry-exporter-otlp>=1.23,<2.0",
]

# All optional dependencies
all = [
  "omnicopilot[dev,notebooks,demo,distributed,observability]",
]

[project.scripts]
omnicopilot = "omnicopilot.__main__:main"

[project.urls]
Repository = "https://github.com/omnicopilot/omnicopilot"
Documentation = "https://omnicopilot.github.io"
Issues = "https://github.com/omnicopilot/omnicopilot/issues"

# ─── Build System ────────────────────────────────────────────────────────────

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/omnicopilot"]

# ─── Ruff (Linting + Formatting) ────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["python"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "D",    # pydocstyle
  "UP",   # pyupgrade
  "ANN",  # flake8-annotations
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "TCH",  # flake8-type-checking
  "RUF",  # ruff-specific rules
  "PT",   # flake8-pytest-style
  "S",    # flake8-bandit (security)
  "DTZ",  # flake8-datetimez
]
ignore = [
  "D100",   # Missing docstring in public module (allow for __init__.py)
  "D104",   # Missing docstring in public package
  "ANN101", # Missing type annotation for self
  "ANN102", # Missing type annotation for cls
  "S101",   # Use of assert (allowed in tests)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN", "S101"]
"notebooks/**/*.py" = ["D", "ANN", "E501"]
"scripts/**/*.py" = ["D103"]

# ─── MyPy (Type Checking) ───────────────────────────────────────────────────

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "torch.*",
  "torchvision.*",
  "lightning.*",
  "open3d.*",
  "carla.*",
  "wandb.*",
  "hydra.*",
  "omegaconf.*",
  "gymnasium.*",
  "onnx.*",
  "onnxruntime.*",
  "plotly.*",
  "rerun.*",
  "streamlit.*",
  "langgraph.*",
  "qdrant_client.*",
  "sentence_transformers.*",
  "ray.*",
]
ignore_missing_imports = true

# ─── Pytest ──────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "-ra",
  "--tb=short",
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks integration tests",
  "gpu: marks tests requiring GPU",
  "carla: marks tests requiring CARLA simulator",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:pkg_resources",
]

# ─── Coverage ────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["python/omnicopilot"]
omit = ["*/tests/*", "*/notebooks/*"]

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 80
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
]
