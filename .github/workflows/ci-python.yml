name: Python CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'python/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/ci-python.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'python/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'

jobs:
  lint-and-type-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint with ruff
        run: uv run ruff check python/ tests/ scripts/

      - name: Format check with ruff
        run: uv run ruff format --check python/ tests/ scripts/

      - name: Type check with mypy
        run: uv run mypy python/omnicopilot/

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: |
          uv run pytest tests/unit/ \
            --cov=python/omnicopilot \
            --cov-report=xml \
            --cov-report=term-missing \
            -x \
            --timeout=120

      - name: Run property-based tests
        run: |
          uv run pytest tests/property/ \
            --timeout=300 \
            -x

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  integration:
    runs-on: ubuntu-24.04
    needs: [lint-and-type-check, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run integration tests
        run: |
          uv run pytest tests/integration/ \
            -m "not carla and not gpu" \
            --timeout=300 \
            -x

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Security lint (bandit rules via ruff)
        run: uv run ruff check python/ --select S

      - name: Check for known vulnerabilities
        run: uv run pip-audit
