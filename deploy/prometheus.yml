# Prometheus configuration for OmniCopilot metrics collection
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'omnicopilot-runtime'
    static_configs:
      - targets: ['runtime:8000']
    metrics_path: /metrics

  - job_name: 'omnicopilot-ml'
    static_configs:
      - targets: ['ml:8000']
    metrics_path: /metrics
    scrape_interval: 30s
